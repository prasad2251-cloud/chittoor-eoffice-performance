name: Update E-Office Dashboard

on:
  push:
    paths:
      - 'eoffice.xlsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Excel reader
        run: pip install pandas openpyxl

      - name: Convert Excel to dashboard JSON
        run: python update_eoffice.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json subdivision_data.json
          git rm -f eoffice.xlsx || true
          git diff --cached --quiet && exit 0
          git commit -m "Auto update E-Office dashboard from Excel"
          git push
